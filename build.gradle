// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.google.com' }
        google()
        maven { url 'https://jitpack.io' }
        gradlePluginPortal()

    }
    //kotlin
    ext.kotlin_version = '2.2.20'
    ext.coroutines_version = "1.10.2"
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0' // or latest
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.4"

    }
}

ext {
        androidXTestVersion = "1.7.0"

        //multidex
        multidex_version = "2.0.1"
        //libraries versions
        fragment_version = "1.9.1"
        activity_version = "1.13.0"
        appcompat_version = "1.8.0"
        preference_version = "1.2.1"
        work_version = "2.12.0"

        acra_version = "5.13.1"
        lifecycle_version = "2.11.0"
        arch_version = "2.1.0"
        room_version = "2.8.5"

    }

allprojects {
    repositories {
        maven { url 'https://maven.google.com' }
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }

    }
}
